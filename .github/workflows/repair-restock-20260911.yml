name: Restock repair verification
on:
  push:
    branches: [fix/restock-sales-20260911]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repair when present
        run: |
          if [ -f scripts/repair-restock-20260911.py ]; then
            python3 scripts/repair-restock-20260911.py
          fi
      - run: npm test
      - name: Commit verified repair on isolated branch
        run: |
          if [ -f scripts/repair-restock-20260911.py ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html tests/restock-sales.test.js
            git commit -m 'fix: distinguish missing sales and hide AWD columns by default'
            git push origin HEAD:fix/restock-sales-20260911
          fi
      - name: Bundle verified source and existing Excel runtime
        run: |
          git archive --format=zip HEAD -o /tmp/fba-source.zip
          curl --fail --retry 3 https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js -o /tmp/exceljs.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: verified-fba-source
          path: |
            /tmp/fba-source.zip
            /tmp/exceljs.min.js
          retention-days: 1
